<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Strategy Manager</title>

  <style>

    html{
      overflow: hidden;
      height: 100%;

    }
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 0;
      margin: 0;
    }

    button {
      padding: 8px 14px;
      cursor: pointer;
    }

    #strategyList {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      overflow: auto;
      border-top: 1px solid;
    }

    .strategy-box {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      width: 200px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: relative;
      display: flex;
      flex-direction: column;
      row-gap: 10px;
    }
    .silent-btn{
      margin-right: auto;
    }

    .strategy-box h4 {
      margin: 0 0 6px;
    }

    .delete-btn {
      position: absolute;
      top: 6px;
      left: 6px;
      font-size: 12px;
      background: #ff4d4f;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 6px;
    }

    /* modal */
    /* .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background: #fff;
      padding: 16px;
      width: 400px;
      border-radius: 8px;
    } */

    textarea {
      width: 100%;
      height: 120px;
    }
    .has-alarm-profit{
      border: 7px solid #00d820;
      background: #f4fdf4;
      
    }
    .has-error{
      border: 7px solid red;
      background: #f6dede;
    }
    .action-buttons-cnt{
      display: flex;
      column-gap: 100px;
      padding: 10px;
    }
  </style>
</head>

<body>

  <!-- <button id="addStrategyBtn">➕ افزودن استراتژی</button> -->
   <div class="action-buttons-cnt">
     <button id="saveGroupsBtn">ذخیره</button>
     <div>
      <label >تعداد موقعیت باز : </label>
      <span id="totalPositionsCount"></span>

     </div>
     <button style="margin-right: auto;" id="loadGroupsBtn">بازیابی</button>

    <label>
      <input type="radio" name="sortType" value="positionCost" >
      هزینه
    </label>
    
    <label>
      <input type="radio" name="sortType" value="daysLeft" >
      تا سررسید
    </label>

    <button id="strategyExerciseCostSummary" style="float: left;">نمایش هزینه اعمال</button>


     <button id="silentAllBtn" style="float: left;">سکوت موقت</button>
   </div>

  <div id="strategyList"></div>
